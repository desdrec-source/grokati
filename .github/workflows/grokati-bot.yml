name: Grokati bot

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: bot/requirements.txt

      - name: Install bot dependencies
        working-directory: bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Grokati bot
        working-directory: bot
        env:
          LIVE_MODE: "true"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          LOG_LEVEL: INFO
        run: python main.py

      - name: Commit and push new content (if any)
        run: |
          git config user.name "grokati-bot"
          git config user.email "bot@grokati.com"
          git add website/src/content/articles website/public/images/articles bot/state/processed.json || true
          if git diff --staged --quiet; then
            echo "No new content to commit."
            exit 0
          fi
          git commit -m "Bot: new high-signal Grok/xAI articles"
          git push
